<section class="page-header">

    <div class="page-header__content">

        <h1 class="page-header__title">

            {{ layout.pageHeader().title }}

        </h1>

        @if (layout.pageHeader().subtitle) {

            <p class="page-header__subtitle">

                {{ layout.pageHeader().subtitle }}

            </p>

        }

    </div>

    @if (layout.pageHeader().actions.length > 0) {

        <div class="page-header__actions">

            @for (
                action of layout.pageHeader().actions;
                track trackByAction($index, action)
            ) {

                <button
                    type="button"
                    class="page-action"
                    [class.primary]="action.color === 'primary'"
                    [class.secondary]="action.color === 'secondary'"
                    [class.success]="action.color === 'success'"
                    [class.warning]="action.color === 'warning'"
                    [class.danger]="action.color === 'danger'"
                    [disabled]="action.disabled"
                    (click)="onActionClick(action)">

                    @if (action.icon) {

                        <erp-icon
                            [name]="action.icon"
                            size="sm">
                        </erp-icon>

                    }

                    <span>

                        {{ action.label }}

                    </span>

                </button>

            }

        </div>

    }

</section>

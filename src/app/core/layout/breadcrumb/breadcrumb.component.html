<nav
    class="breadcrumb"
    aria-label="Breadcrumb">

    <ol class="breadcrumb-list">

        @for (
            item of layout.breadcrumbs();
            track item.label;
            let last = $last
        ) {

            <li class="breadcrumb-item">

                @if (!last && item.url) {

                    <a
                        [routerLink]="item.url">

                        {{ item.label }}

                    </a>

                } @else {

                    <span
                        class="active">

                        {{ item.label }}

                    </span>

                }

                @if (!last) {

                    <span class="separator">

                        /

                    </span>

                }

            </li>

        }

    </ol>

</nav>

<a
  class="menu-item"
  [routerLink]="item.route"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
  (click)="onNavigate()"
>
  <erp-icon
    [name]="item.icon"
    size="md">
  </erp-icon>

  @if (!collapsed) {
    <span class="label">
      {{ item.title }}
    </span>
  }
</a>

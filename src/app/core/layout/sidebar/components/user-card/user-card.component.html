<div class="user-card">
  <!-- <erp-avatar [initials]="user.initials" size="lg"> </erp-avatar> -->

  @if (!collapsed) {
    <div class="details">
      <div class="name">
        {{ user.name }}
      </div>

      <div class="role">
        {{ user.role }}
      </div>
    </div>

    <button class="menu-btn" type="button">
      <erp-icon name="menu" size="sm"> </erp-icon>
    </button>
  }
</div>

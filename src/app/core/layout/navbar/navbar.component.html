<header class="navbar">
  <div class="navbar-left">
    <button class="icon-btn" (click)="toggleSidebar()">☰</button>

    <div class="breadcrumb">
      Dashboard

      <span>/</span>

      Home
    </div>
  </div>

  <div class="navbar-center">
    <div class="search-box">
      <input type="text" placeholder="Search students, teachers, classes..." />
    </div>
  </div>

  <div class="navbar-right">
    <button class="icon-btn" (click)="toggleTheme()">🌙</button>

    <button class="icon-btn" (click)="toggleFullscreen()">⛶</button>

    <button class="icon-btn">🔔</button>

    <div class="profile" [matMenuTriggerFor]="menu">
      <img src="assets/images/avatar.png" alt="Profile" />
    </div>
  </div>
</header>

<mat-menu #menu="matMenu">
  <button mat-menu-item>Profile</button>

  <button mat-menu-item>Settings</button>

  <button mat-menu-item>Logout</button>
</mat-menu>

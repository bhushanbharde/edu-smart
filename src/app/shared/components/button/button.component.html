<button
  [type]="type"
  class="erp-button"
  [class.erp-button--primary]="variant === 'primary'"
  [class.erp-button--secondary]="variant === 'secondary'"
  [class.erp-button--outline]="variant === 'outline'"
  [class.erp-button--ghost]="variant === 'ghost'"
  [class.erp-button--danger]="variant === 'danger'"
  [class.erp-button--success]="variant === 'success'"
  [class.erp-button--warning]="variant === 'warning'"
  [class.erp-button--text]="variant === 'text'"
  [class.erp-button--sm]="size === 'sm'"
  [class.erp-button--md]="size === 'md'"
  [class.erp-button--lg]="size === 'lg'"
  [class.erp-button--rounded]="rounded"
  [class.erp-button--full]="fullWidth"
  [disabled]="disabled || loading"
>
  @if (loading) {
    <span class="erp-button__spinner"></span>
  }

  @if (leftIcon && !loading) {
    <erp-icon [name]="leftIcon"></erp-icon>
  }

  @if (label) {
    <span>{{ label }}</span>
  }

  @if (rightIcon && !loading) {
    <erp-icon [name]="rightIcon"></erp-icon>
  }
</button>
